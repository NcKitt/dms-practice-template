# Deploy ด้วย Docker:  docker compose up -d --build
# เปิดเว็บที่ http://localhost:8080  (PM2 ใช้พอร์ต 3000 จึงรันพร้อมกันเพื่อเทียบได้)
services:
  app:
    build: .
    image: practice-app:${APP_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 3000
      DEPLOY_TARGET: docker
      APP_TITLE: ${APP_TITLE:-บอร์ดประกาศหน่วยงาน}
      DATA_FILE: /app/data/announcements.json
    ports:
      - "${HOST_PORT:-8080}:3000"
    volumes:
      - app-data:/app/data

volumes:
  app-data:
